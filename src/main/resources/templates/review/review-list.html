<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>My Reviews - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4">
    <h3 class="fw-bold mb-3">⭐ My Reviews</h3>
    <div th:if="${#lists.isEmpty(reviews)}" class="card p-5 text-center">
      <p class="text-muted">You haven't reviewed any products yet.</p>
      <a th:href="@{/products}" class="btn btn-primary">Browse Products</a>
    </div>
    <div class="row g-3" th:unless="${#lists.isEmpty(reviews)}">
      <div class="col-md-6" th:each="r : ${reviews}">
        <div class="card p-3">
          <div class="d-flex justify-content-between">
            <h6 class="fw-bold" th:text="${r.productName}"></h6>
            <span class="stars" th:text="${'★'.repeat(r.rating)}"></span>
          </div>
          <p class="mb-1 text-muted small" th:text="${r.comment}"></p>
          <p class="mb-2 small text-muted" th:text="${r.reviewDate}"></p>
          <span class="badge bg-success me-2" th:if="${r.approved}">Approved</span>
          <span class="badge bg-secondary me-2" th:unless="${r.approved}">Pending</span>
          <span class="badge bg-primary" th:if="${r.reviewType == 'VERIFIED'}">Verified Purchase</span>
          <!-- Edit inline -->
          <button class="btn btn-sm btn-warning mt-2"
            onclick="editReview([[${r.id}]],[[${r.rating}]],'[[${r.comment}]]')">Edit</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Edit Review</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="editForm" method="post">
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Rating (1-5)</label>
            <input type="number" id="editRating" name="rating" class="form-control" min="1" max="5"></div>
          <div class="mb-3"><label class="form-label">Comment</label>
            <textarea id="editComment" name="comment" class="form-control" rows="3"></textarea></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function editReview(id, rating, comment) {
      document.getElementById('editForm').action = '/reviews/edit/' + id;
      document.getElementById('editRating').value = rating;
      document.getElementById('editComment').value = comment;
      new bootstrap.Modal(document.getElementById('editModal')).show();
    }
  </script>
</body>
</html>
