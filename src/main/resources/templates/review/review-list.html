<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>My Reviews - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    .edit-panel {
      display: none;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 16px;
      margin-top: 12px;
    }
    .star-display { color: #f39c12; font-size: 1.1rem; letter-spacing: 2px; }
    .review-card { border-radius: 14px; border: 1px solid #e8e3dc; }
  </style>
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4" style="max-width: 760px;">
    <h3 class="fw-bold mb-4">⭐ My Reviews</h3>

    <div th:if="${#lists.isEmpty(reviews)}" class="card p-5 text-center">
      <p class="text-muted">You haven't reviewed any products yet.</p>
      <a th:href="@{/products}" class="btn btn-primary">Browse Products</a>
    </div>

    <div class="d-flex flex-column gap-3" th:unless="${#lists.isEmpty(reviews)}">
      <div class="card review-card p-3" th:each="r : ${reviews}">

        <!-- Review Header -->
        <div class="d-flex justify-content-between align-items-start mb-1">
          <h6 class="fw-bold mb-0" th:text="${r.productName}"></h6>
          <span class="star-display" th:text="${'★'.repeat(r.rating) + '☆'.repeat(5 - r.rating)}"></span>
        </div>

        <!-- Comment & Date -->
        <p class="mb-1 text-muted" th:text="${r.comment}" style="font-size:.9rem;"></p>
        <p class="mb-2 text-muted" th:text="${r.reviewDate}" style="font-size:.8rem;"></p>

        <!-- Badges -->
        <div class="d-flex gap-2 mb-2">
          <span class="badge bg-success" th:if="${r.approved}">Approved</span>
          <span class="badge bg-secondary" th:unless="${r.approved}">Pending</span>
          <span class="badge bg-primary" th:if="${r.reviewType == 'VERIFIED'}">Verified Purchase</span>
        </div>

        <!-- Edit Button — only for non-approved reviews -->
        <button type="button" class="btn btn-warning btn-sm fw-bold"
                th:if="${!r.approved}"
                th:onclick="'toggleEdit(' + ${r.id} + ')'">✏️ Edit</button>
        <p th:if="${r.approved}" class="small text-muted fst-italic mb-0">
          🔒 Approved reviews cannot be edited.
        </p>

        <!-- Inline Edit Panel — only for non-approved reviews -->
        <div th:if="${!r.approved}" th:id="'edit-' + ${r.id}" class="edit-panel">
          <p class="fw-semibold mb-2" style="font-size:.9rem;">Edit Your Review</p>
          <form th:action="@{/reviews/edit/{id}(id=${r.id})}" method="post">

            <div class="mb-2">
              <label class="form-label small fw-semibold mb-1">Rating</label>
              <div class="d-flex gap-2">
                <th:block th:each="i : ${#numbers.sequence(1,5)}">
                  <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="rating"
                           th:id="'r' + ${r.id} + '_' + ${i}"
                           th:value="${i}"
                           th:checked="${i == r.rating}">
                    <label class="form-check-label" th:for="'r' + ${r.id} + '_' + ${i}"
                           style="color:#f39c12;" th:text="${i} + '★'"></label>
                  </div>
                </th:block>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold mb-1">Comment</label>
              <textarea name="comment" class="form-control form-control-sm" rows="3"
                        th:text="${r.comment}" placeholder="Your review..."></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary btn-sm fw-bold px-4">💾 Save</button>
              <button type="button" class="btn btn-outline-secondary btn-sm"
                      th:onclick="'toggleEdit(' + ${r.id} + ')'">Cancel</button>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleEdit(id) {
      const panel = document.getElementById('edit-' + id);
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }
  </script>
</body>
</html>
