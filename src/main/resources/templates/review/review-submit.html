<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Write a Review - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4" style="max-width:500px;">
    <h3 class="fw-bold mb-3">⭐ Write a Review</h3>
    <div class="card p-4">
      <form th:action="@{/reviews/submit}" method="post">
        <input type="hidden" name="productId" th:value="${productId}">
        <input type="hidden" name="productName" th:value="${productName}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Your Rating</label>
          <div class="d-flex gap-2">
            <div th:each="i : ${#numbers.sequence(1, 5)}" class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="rating" th:value="${i}" th:id="'star' + ${i}" required>
              <label class="form-check-label stars" th:for="'star' + ${i}" th:text="${i} + ' ★'"></label>
            </div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Your Review</label>
          <textarea name="comment" class="form-control" rows="4" placeholder="Share your experience..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary fw-bold">Submit Review</button>
        <a th:href="@{/products}" class="btn btn-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
