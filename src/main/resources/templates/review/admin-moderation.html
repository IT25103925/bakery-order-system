<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Review Moderation - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4">
    <h3 class="fw-bold mb-3">⭐ Review Moderation (Admin)</h3>
    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-dark"><tr>
            <th>#</th><th>User</th><th>Product</th><th>Rating</th><th>Comment</th><th>Date</th><th>Type</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody>
            <tr th:each="r : ${allReviews}">
              <td th:text="${r.id}"></td>
              <td th:text="${r.maskedUsername}"></td><!-- Information Hiding applied -->
              <td th:text="${r.productName}"></td>
              <td class="stars" th:text="${'★'.repeat(r.rating)}"></td>
              <td th:text="${r.comment}" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></td>
              <td th:text="${r.reviewDate}"></td>
              <td><span th:classappend="${r.reviewType == 'VERIFIED'} ? 'badge bg-primary' : 'badge bg-secondary'" th:text="${r.reviewType}"></span></td>
              <td><span th:classappend="${r.approved} ? 'badge bg-success' : 'badge bg-warning'" th:text="${r.approved ? 'Approved' : 'Pending'}"></span></td>
              <td>
                <form th:action="@{/reviews/admin/approve/{id}(id=${r.id})}" method="post" style="display:inline" th:unless="${r.approved}">
                  <button class="btn btn-sm btn-success">✓</button>
                </form>
                <form th:action="@{/reviews/admin/delete/{id}(id=${r.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete?')">
                  <button class="btn btn-sm btn-danger">✕</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
