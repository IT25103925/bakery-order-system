<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Edit Cake Booking - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4" style="max-width:500px;">
    <h3 class="fw-bold mb-3">✏️ Edit Cake Design</h3>
    <div class="card p-4">
      <form th:action="@{/cakes/edit/{id}(id=${cake.id})}" method="post">
        <div class="mb-3"><label class="form-label fw-semibold">Flavor</label>
          <input type="text" name="flavor" class="form-control" th:value="${cake.flavor}" required></div>
        <div class="mb-3"><label class="form-label fw-semibold">Tiers</label>
          <input type="number" name="tiers" class="form-control" th:value="${cake.tiers}" min="1" max="6"></div>
        <div class="mb-3"><label class="form-label fw-semibold">Message</label>
          <input type="text" name="message" class="form-control" th:value="${cake.message}"></div>
        <button type="submit" class="btn btn-primary fw-bold">Save Changes</button>
        <a th:href="@{/cakes/status}" class="btn btn-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
