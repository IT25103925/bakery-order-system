<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Order Confirmed - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-5 text-center" style="max-width:500px;">
    <div class="card p-5">
      <div style="font-size:4rem">✅</div>
      <h3 class="fw-bold mt-2">Order Placed!</h3>
      <p class="text-muted">Your order has been confirmed and will be prepared fresh.</p>
      <div class="alert alert-success">
        <strong>Order #<span th:text="${order.id}"></span></strong><br>
        Total: Rs. <span th:text="${#numbers.formatDecimal(order.totalAmount,1,2)}"></span><br>
        Payment: <span th:text="${order.paymentMethod}"></span><br>
        Status: <span th:text="${order.status}"></span>
      </div>
      <a th:href="@{/orders/history}" class="btn btn-primary me-2">View My Orders</a>
      <a th:href="@{/products}" class="btn btn-outline-primary">Continue Shopping</a>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
