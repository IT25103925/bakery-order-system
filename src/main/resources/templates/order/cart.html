<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Shopping Cart - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4">
    <h3 class="fw-bold mb-3">🛒 Shopping Cart</h3>
    <div class="row g-4">
      <div class="col-md-8">
        <div class="card" th:if="${!#lists.isEmpty(cart)}">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light"><tr>
                <th>Product</th><th>Unit Price</th><th>Qty</th><th>Subtotal</th><th></th>
              </tr></thead>
              <tbody>
                <tr th:each="item : ${cart}">
                  <td th:text="${item.productName}"></td>
                  <td>Rs. <span th:text="${#numbers.formatDecimal(item.unitPrice,1,2)}"></span></td>
                  <td th:text="${item.quantity}"></td>
                  <td class="fw-semibold">Rs. <span th:text="${#numbers.formatDecimal(item.subtotal,1,2)}"></span></td>
                  <td>
                    <form th:action="@{/orders/cart/remove/{id}(id=${item.productId})}" method="post">
                      <button class="btn btn-sm btn-outline-danger">✕</button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="card p-4 text-center" th:if="${#lists.isEmpty(cart)}">
          <p class="fs-5 text-muted">Your cart is empty 🛒</p>
          <a th:href="@{/products}" class="btn btn-primary">Browse Products</a>
        </div>
      </div>
      <div class="col-md-4" th:if="${!#lists.isEmpty(cart)}">
        <div class="card p-4">
          <h5 class="fw-bold mb-3">Order Summary</h5>
          <div class="d-flex justify-content-between mb-2"><span>Subtotal:</span>
            <span>Rs. <span th:text="${#numbers.formatDecimal(total,1,2)}"></span></span></div>
          <div class="d-flex justify-content-between mb-3 border-top pt-2 fw-bold fs-5">
            <span>Total:</span><span class="text-danger">Rs. <span th:text="${#numbers.formatDecimal(total,1,2)}"></span></span>
          </div>
          <a th:href="@{/orders/checkout}" class="btn btn-primary w-100 fw-bold py-2">Proceed to Checkout →</a>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
