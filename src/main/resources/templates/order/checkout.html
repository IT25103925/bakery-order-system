<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Checkout - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    .card-input-row { display: flex; gap: 12px; }
    #cardDetails { border: 1px solid #dee2e6; border-radius: 10px; padding: 16px; background: #fafafa; margin-top: 8px; }
    .card-icon { font-size: 1.4rem; }
  </style>
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4">
    <h3 class="fw-bold mb-3">💳 Checkout</h3>
    <div class="row g-4">
      <div class="col-md-7">
        <div class="card p-4">
          <h5 class="fw-bold mb-3">Order Items</h5>
          <div th:each="item : ${cart}" class="d-flex justify-content-between border-bottom py-2">
            <span th:text="${item.productName}"></span>
            <span>x<span th:text="${item.quantity}"></span> = Rs.<span th:text="${#numbers.formatDecimal(item.subtotal,1,2)}"></span></span>
          </div>
          <div class="d-flex justify-content-between pt-3 fw-bold fs-5">
            <span>Total:</span>
            <span class="text-danger">Rs. <span th:text="${#numbers.formatDecimal(total,1,2)}"></span></span>
          </div>
        </div>
      </div>
      <div class="col-md-5">
        <div class="card p-4">
          <h5 class="fw-bold mb-3">Payment Details</h5>
          <form th:action="@{/orders/place}" method="post" id="checkoutForm">
            <div class="mb-3">
              <label class="form-label fw-semibold">Payment Method</label>
              <select name="paymentMethod" class="form-select" id="paymentMethodSelect" onchange="toggleCardDetails(this.value)">
                <option value="CASH_ON_PICKUP">💵 Cash on Pickup</option>
                <option value="ONLINE_SIMULATION">💳 Online Payment (Card)</option>
              </select>
            </div>

            <!-- Card Details — shown only for Online Payment -->
            <div id="cardDetails" style="display:none;" class="mb-3">
              <p class="fw-semibold mb-2" style="font-size:.9rem;">💳 Card Information</p>

              <div class="mb-2">
                <label class="form-label small text-muted mb-1">Cardholder Name</label>
                <input type="text" id="cardName" class="form-control form-control-sm"
                       placeholder="Name on card" autocomplete="cc-name">
              </div>

              <div class="mb-2">
                <label class="form-label small text-muted mb-1">Card Number</label>
                <input type="text" id="cardNumber" class="form-control form-control-sm"
                       placeholder="1234 5678 9012 3456" maxlength="19"
                       autocomplete="cc-number" oninput="formatCardNumber(this)">
              </div>

              <div class="card-input-row mb-2">
                <div style="flex:1">
                  <label class="form-label small text-muted mb-1">Expiry Date</label>
                  <input type="text" id="cardExpiry" class="form-control form-control-sm"
                         placeholder="MM/YY" maxlength="5"
                         oninput="formatExpiry(this)">
                </div>
                <div style="flex:1">
                  <label class="form-label small text-muted mb-1">CVV</label>
                  <input type="text" id="cardCvv" class="form-control form-control-sm"
                         placeholder="123" maxlength="3" autocomplete="cc-csc">
                </div>
              </div>

              <div class="d-flex align-items-center gap-1 mt-2" style="font-size:.75rem; color:#888;">
                <span>🔒</span> <span>Simulated payment — no real charges</span>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold">Special Notes</label>
              <textarea name="notes" class="form-control" rows="2" placeholder="Allergies, preferences..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Place Order ✓</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleCardDetails(value) {
      document.getElementById('cardDetails').style.display =
        value === 'ONLINE_SIMULATION' ? 'block' : 'none';
    }

    function formatCardNumber(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 16);
      input.value = v.match(/.{1,4}/g)?.join(' ') || v;
    }

    function formatExpiry(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 4);
      if (v.length >= 3) v = v.substring(0,2) + '/' + v.substring(2);
      input.value = v;
    }
  </script>
</body>
</html>
