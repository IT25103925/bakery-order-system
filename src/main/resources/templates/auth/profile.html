<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>My Profile - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4" style="max-width:600px;">
    <h3 class="fw-bold mb-3">👤 My Profile</h3>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="card p-4">
      <form th:action="@{/users/profile/update}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control bg-light" th:value="${user?.username}" disabled>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Role</label>
          <input type="text" class="form-control bg-light" th:value="${user?.role}" disabled>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" th:value="${user?.email}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Phone</label>
          <input type="text" name="phone" class="form-control" th:value="${user?.phone}">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Address</label>
          <textarea name="address" class="form-control" rows="2"></textarea>
        </div>
        <button type="submit" class="btn btn-primary fw-bold">Update Profile</button>
        <a th:href="@{/customer/dashboard}" class="btn btn-secondary ms-2">Back</a>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
