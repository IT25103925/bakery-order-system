<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="bakery-hero mb-0 pb-4 pt-4">
    <h1>🍰 SweetBite Bakery</h1>
    <p>Fresh baked goods & custom cakes, delivered with love</p>
  </div>
  <div class="container" style="max-width:420px; margin-top:40px;">
    <div class="card p-4">
      <h4 class="text-center mb-3 fw-bold">Welcome Back!</h4>
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
      <form th:action="@{/login}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Login</button>
      </form>
      <hr>
      <p class="text-center mb-0">Don't have an account? <a th:href="@{/register}">Register here</a></p>
      <p class="text-center mt-2 text-muted small">Staff: admin / admin123</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
