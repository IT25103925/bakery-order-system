<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Customer Login - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg, #fff5f5 0%, #ffe0e0 100%); min-height: 100vh; }
    .login-card { border-top: 4px solid #c0392b; }
    .brand-icon { font-size: 3rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center">
  <div style="width:100%; max-width:420px; padding:20px;">

    <!-- Logo -->
    <div class="text-center mb-4">
      <div class="brand-icon">🛒</div>
      <h3 class="fw-bold mt-2" style="color:#c0392b;">SweetBite Bakery</h3>
      <p class="text-muted mb-0">Customer Portal</p>
    </div>

    <!-- Card -->
    <div class="card login-card shadow p-4">
      <h5 class="fw-bold mb-3 text-center">Customer Login</h5>

      <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
      <div th:if="${success}" class="alert alert-success py-2 small" th:text="${success}"></div>

      <form th:action="@{/customer-login}" method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Login</button>
      </form>

      <hr class="my-3">
      <p class="text-center mb-1 small">
        New customer? <a th:href="@{/register}" class="fw-semibold">Register here</a>
      </p>
      <p class="text-center mb-0 small text-muted">
        Staff member? <a th:href="@{/admin-login}" class="text-secondary">Admin Login</a>
      </p>
    </div>

    <p class="text-center text-muted small mt-3">
      &copy; 2024 SweetBite Bakery - SE1020 OOP Project
    </p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
