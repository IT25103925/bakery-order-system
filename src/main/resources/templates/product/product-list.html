<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Products - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
  <style>
    .product-card { border-radius: 16px; border: none; box-shadow: 0 2px 16px rgba(0,0,0,0.08); transition: transform 0.22s, box-shadow 0.22s; overflow: hidden; height: 100%; }
    .product-card:hover { transform: translateY(-6px); box-shadow: 0 12px 32px rgba(192,57,43,0.15); }

    .product-img-wrap { position: relative; height: 200px; overflow: hidden; background: linear-gradient(135deg, #f8d7b5, #f5c6a0); }
    .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s; }
    .product-card:hover .product-img-wrap img { transform: scale(1.06); }
    .product-img-emoji { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 5rem; }

    .type-badge { position: absolute; top: 12px; right: 12px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; padding: 4px 10px; border-radius: 20px; background: rgba(44,62,80,0.82); color: #fff; }
    .type-badge.perishable { background: rgba(192,57,43,0.88); }
    .type-badge.nonperishable { background: rgba(39,174,96,0.88); }

    .card-body { padding: 18px 20px 16px; display: flex; flex-direction: column; }
    .product-name { font-size: 1.05rem; font-weight: 700; color: #2c3e50; margin-bottom: 4px; }
    .product-desc { font-size: 0.85rem; color: #888; flex-grow: 1; margin-bottom: 10px; line-height: 1.45; }
    .product-price { font-size: 1.2rem; font-weight: 800; color: #c0392b; margin-bottom: 4px; }
    .product-stock { font-size: 0.8rem; color: #aaa; margin-bottom: 14px; }
    .product-stock span { font-weight: 600; color: #555; }

    .btn-view { border: 2px solid #c0392b; color: #c0392b; background: transparent; border-radius: 8px; font-weight: 600; font-size: 0.88rem; padding: 7px 0; flex: 1; transition: all 0.18s; }
    .btn-view:hover { background: #c0392b; color: white; }
    .btn-cart { background: #c0392b; color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 0.88rem; padding: 7px 0; flex: 1.5; transition: background 0.18s; }
    .btn-cart:hover:not(:disabled) { background: #96281b; }
    .btn-cart:disabled { background: #ccc; cursor: not-allowed; }

    .search-bar { background: white; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); padding: 18px 20px; margin-bottom: 28px; }
    .search-bar .form-control { border-radius: 8px; border: 1.5px solid #e9ecef; font-size: 0.97rem; padding: 10px 16px; }
    .search-bar .form-control:focus { border-color: #c0392b; box-shadow: 0 0 0 3px rgba(192,57,43,0.12); }
    .section-title { font-size: 1.35rem; font-weight: 700; color: #2c3e50; margin-bottom: 20px; }
    .no-products { background: white; border-radius: 16px; padding: 60px 20px; text-align: center; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
  </style>
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>

  <div class="bakery-hero py-3">
    <h2>🛒 Our Products</h2>
    <p>Fresh from the oven, every day</p>
  </div>

  <div class="container mt-4 mb-5">

    <!-- Search Bar -->
    <div class="search-bar d-flex gap-2">
      <form th:action="@{/products}" method="get" class="d-flex gap-2 w-100">
        <input type="text" name="search" class="form-control" placeholder="Search products..." th:value="${search}">
        <button class="btn btn-primary px-4 fw-bold">Search</button>
        <a th:href="@{/products}" class="btn btn-outline-secondary">Clear</a>
      </form>
    </div>

    <!-- Products Grid -->
    <div class="section-title" th:if="${!#lists.isEmpty(products)}"
         th:text="${search != null and !search.isEmpty()} ? 'Results for &quot;' + ${search} + '&quot;' : 'All Products'">All Products</div>

    <div class="row g-4">
      <div class="col-xl-3 col-md-4 col-sm-6" th:each="p : ${products}">
        <div class="product-card">

          <!-- Image Area -->
          <div class="product-img-wrap">
            <!-- Real image if imageUrl set -->
            <img th:if="${p.imageUrl != null and !p.imageUrl.isEmpty()}"
                 th:src="${p.imageUrl}" th:alt="${p.name}">
            <!-- Category photo fallback -->
            <img th:unless="${p.imageUrl != null and !p.imageUrl.isEmpty()}"
                 th:src="${p.category == 'BREAD' ? 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400&q=80' :
                          p.category == 'PASTRY' ? 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400&q=80' :
                          p.category == 'CAKE' ? 'https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=400&q=80' :
                          p.category == 'COOKIE' ? 'https://images.unsplash.com/photo-1499636136210-6f4ee915583e?w=400&q=80' :
                          p.category == 'MUFFIN' ? 'https://images.unsplash.com/photo-1607958996333-41aef7caefaa?w=400&q=80' :
                          'https://images.unsplash.com/photo-1486427944299-d1955d23e34d?w=400&q=80'}"
                 th:alt="${p.name}"
                 style="width:100%;height:100%;object-fit:cover;">
            <!-- Type Badge -->
            <span class="type-badge perishable" th:if="${p.type == 'PERISHABLE'}" th:text="${p.type}">PERISHABLE</span>
            <span class="type-badge nonperishable" th:if="${p.type == 'NON-PERISHABLE'}" th:text="${p.type}">NON-PERISHABLE</span>
            <span class="type-badge" th:unless="${p.type == 'PERISHABLE' or p.type == 'NON-PERISHABLE'}" th:text="${p.type}">TYPE</span>
          </div>

          <!-- Card Body -->
          <div class="card-body">
            <div class="product-name" th:text="${p.name}">Product Name</div>
            <div class="product-desc" th:text="${p.description}">Description here</div>
            <div class="product-price" th:text="${p.displayPrice}">Rs. 0.00</div>
            <div class="product-stock">Stock: <span th:text="${p.stockQuantity}">0</span> left</div>
            <div class="d-flex gap-2">
              <a th:href="@{/products/{id}(id=${p.id})}" class="btn-view text-center text-decoration-none">View</a>
              <form th:action="@{/orders/cart/add}" method="post" style="flex:1.5;">
                <input type="hidden" name="productId" th:value="${p.id}">
                <input type="hidden" name="quantity" value="1">
                <button class="btn-cart w-100" th:disabled="${!p.available}">Add to Cart</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <!-- Empty state -->
      <div class="col-12" th:if="${#lists.isEmpty(products)}">
        <div class="no-products">
          <div style="font-size:4rem;margin-bottom:16px;">🔍</div>
          <p class="text-muted fs-5 fw-semibold">No products found.</p>
          <a th:href="@{/products}" class="btn btn-primary mt-2">View All Products</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
