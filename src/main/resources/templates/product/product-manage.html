<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Manage Products - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="fw-bold">🧁 Product Management Panel</h3>
      <a th:href="@{/products/add}" class="btn btn-primary">+ Add Product</a>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-dark"><tr>
            <th>ID</th><th>Name</th><th>Category</th><th>Type</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody>
            <tr th:each="p : ${products}" th:classappend="${p.stockQuantity == 0} ? 'table-danger' : ''">
              <td th:text="${p.id}"></td>
              <td th:text="${p.name}"></td>
              <td th:text="${p.category}"></td>
              <td><span class="badge bg-info" th:text="${p.type}"></span></td>
              <td th:text="${p.displayPrice}"></td>
              <td th:text="${p.stockQuantity}"></td>
              <td><span th:text="${p.available ? 'Active' : 'Inactive'}" th:classappend="${p.available} ? 'badge bg-success' : 'badge bg-danger'"></span></td>
              <td>
                <button class="btn btn-sm btn-warning" onclick="editProduct([[${p.id}]],'[[${p.name}]]','[[${p.description}]]',[[${p.price}]],[[${p.stockQuantity}]])">Edit</button>
                <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete?')">
                  <button class="btn btn-sm btn-danger">Del</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Edit Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <form id="editForm" method="post">
        <div class="modal-body">
          <div class="mb-3"><label class="form-label">Name</label><input type="text" id="editName" name="name" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Description</label><input type="text" id="editDesc" name="description" class="form-control"></div>
          <div class="mb-3"><label class="form-label">Price (Rs.)</label><input type="number" id="editPrice" name="price" class="form-control" step="0.01"></div>
          <div class="mb-3"><label class="form-label">Stock Quantity</label><input type="number" id="editQty" name="quantity" class="form-control"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Update</button>
        </div>
      </form>
    </div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function editProduct(id, name, desc, price, qty) {
      document.getElementById('editForm').action = '/products/update/' + id;
      document.getElementById('editName').value = name;
      document.getElementById('editDesc').value = desc;
      document.getElementById('editPrice').value = price;
      document.getElementById('editQty').value = qty;
      new bootstrap.Modal(document.getElementById('editModal')).show();
    }
  </script>
</body>
</html>
