<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Add Product - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
  <div th:replace="~{common/navbar :: navbar}"></div>
  <div class="container mt-4" style="max-width:600px;">
    <h3 class="fw-bold mb-3">➕ Add New Product</h3>
    <div class="card p-4">
      <form th:action="@{/products/add}" method="post" id="addForm">
        <div class="mb-3"><label class="form-label fw-semibold">Product Name</label>
          <input type="text" name="name" class="form-control" required></div>
        <div class="mb-3"><label class="form-label fw-semibold">Description</label>
          <textarea name="description" class="form-control" rows="2"></textarea></div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label fw-semibold">Price (Rs.)</label>
            <input type="number" name="price" class="form-control" step="0.01" required></div>
          <div class="col-md-6 mb-3"><label class="form-label fw-semibold">Stock Quantity</label>
            <input type="number" name="quantity" class="form-control" required></div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3"><label class="form-label fw-semibold">Category</label>
            <select name="category" class="form-select">
              <option>BREAD</option><option>PASTRY</option><option>CAKE</option>
              <option>COOKIE</option><option>BEVERAGE</option><option>OTHER</option>
            </select></div>
          <div class="col-md-6 mb-3"><label class="form-label fw-semibold">Type</label>
            <select name="type" class="form-select" onchange="toggleFields(this.value)">
              <option value="PERISHABLE">Perishable</option>
              <option value="NON_PERISHABLE">Non-Perishable</option>
            </select></div>
        </div>
        <div id="perishableFields">
          <div class="mb-3"><label class="form-label fw-semibold">Expiry Date</label>
            <input type="date" name="expiryDate" class="form-control"></div>
        </div>
        <div id="nonPerishableFields" style="display:none">
          <div class="mb-3"><label class="form-label fw-semibold">Shelf Life (days)</label>
            <input type="number" name="shelfLifeDays" class="form-control" value="30"></div>
        </div>
        <button type="submit" class="btn btn-primary fw-bold">Add Product</button>
        <a th:href="@{/products/manage}" class="btn btn-secondary ms-2">Cancel</a>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleFields(type) {
      document.getElementById('perishableFields').style.display = type === 'PERISHABLE' ? '' : 'none';
      document.getElementById('nonPerishableFields').style.display = type === 'NON_PERISHABLE' ? '' : 'none';
    }
  </script>
</body>
</html>
