<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Supplier Directory - SweetBite Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <style>
        .supplier-card { border-radius:14px;border:none;transition:transform .15s,box-shadow .15s; }
        .supplier-card:hover { transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1) !important; }
        .supplier-avatar { width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px; }
        .avatar-local { background:#d1e7dd;color:#0a3622; }
        .avatar-wholesale { background:#cfe2ff;color:#052c65; }
        .badge-local { background:#d1e7dd;color:#0a3622;font-weight:600; }
        .badge-wholesale { background:#cfe2ff;color:#052c65;font-weight:600; }
        .contact-row { display:flex;align-items:center;gap:8px;font-size:13px;color:#6c757d;margin-bottom:5px; }
        .discount-pill { display:inline-flex;align-items:center;gap:5px;background:#d1e7dd;color:#0a3622;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600; }
        .empty-state { padding:60px 20px;text-align:center; }
    </style>
</head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container mt-4 mb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h4 class="fw-bold mb-0">Supplier Directory</h4>
            <small class="text-muted">Manage your ingredient suppliers</small>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/inventory/purchase-orders}" class="btn btn-outline-primary">
                <i class="bi bi-cart3 me-1"></i> Purchase Orders
            </a>
            <a th:href="@{/inventory/suppliers/add}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i> Add Supplier
            </a>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-md-4" th:each="s : ${suppliers}">
            <div class="card supplier-card p-3 h-100">
                <div class="d-flex align-items-center gap-3 mb-3">
                    <div class="supplier-avatar"
                         th:classappend="${s.supplierType == 'LOCAL'} ? 'avatar-local' : 'avatar-wholesale'"
                         th:text="${#strings.substring(s.name,0,2)}">
                    </div>
                    <div class="flex-grow-1">
                        <div class="fw-bold" th:text="${s.name}"></div>
                        <span class="badge badge-local" th:if="${s.supplierType == 'LOCAL'}">LOCAL</span>
                        <span class="badge badge-wholesale" th:if="${s.supplierType != 'LOCAL'}">WHOLESALE</span>
                    </div>
                </div>

                <div class="contact-row">
                    <i class="bi bi-envelope"></i>
                    <span th:text="${s.contactEmail}"></span>
                </div>
                <div class="contact-row">
                    <i class="bi bi-telephone"></i>
                    <span th:text="${s.phone}"></span>
                </div>
                <div class="contact-row mb-3">
                    <i class="bi bi-geo-alt"></i>
                    <span th:text="${s.address}"></span>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-auto pt-2" style="border-top:1px solid #f0f0f0;">
            <span class="discount-pill">
              <i class="bi bi-tag-fill"></i>
              <span th:text="${s.discountRate * 100} + '% discount'"></span>
            </span>
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-outline-secondary"
                                onclick="editSupplier([[${s.id}]],'[[${s.contactEmail}]]','[[${s.phone}]]')">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <form th:action="@{/inventory/suppliers/delete/{id}(id=${s.id})}" method="post"
                              onsubmit="return confirm('Remove this supplier?')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 empty-state" th:if="${#lists.isEmpty(suppliers)}">
            <div style="font-size:48px;color:#dee2e6;"><i class="bi bi-building-x"></i></div>
            <h6 class="text-muted mt-3">No suppliers found</h6>
            <a th:href="@{/inventory/suppliers/add}" class="btn btn-primary mt-2">
                <i class="bi bi-plus-lg me-1"></i> Add First Supplier
            </a>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:14px;border:none;">
            <div class="modal-header border-0 pb-0">
                <h6 class="modal-title fw-bold">Update Contact Info</h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="editForm" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-semibold">EMAIL ADDRESS</label>
                        <input type="email" id="editEmail" name="email" class="form-control">
                    </div>
                    <div class="mb-1">
                        <label class="form-label text-muted small fw-semibold">PHONE NUMBER</label>
                        <input type="text" id="editPhone" name="phone" class="form-control">
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function editSupplier(id, email, phone) {
        document.getElementById('editForm').action = '/inventory/suppliers/update/' + id;
        document.getElementById('editEmail').value = email;
        document.getElementById('editPhone').value = phone;
        new bootstrap.Modal(document.getElementById('editModal')).show();
    }
</script>
</body>
</html>
