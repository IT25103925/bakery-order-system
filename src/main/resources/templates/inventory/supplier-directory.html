<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Supplier Directory - SweetBite Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="fw-bold">🏭 Supplier Directory</h3>
        <a th:href="@{/inventory/suppliers/add}" class="btn btn-primary">+ Add Supplier</a>
    </div>
    <div class="row g-3">
        <div class="col-md-4" th:each="s : ${suppliers}">
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-start">
                    <h6 class="fw-bold" th:text="${s.name}"></h6>
                    <span class="badge" th:classappend="${s.supplierType == 'LOCAL'} ? 'bg-success' : 'bg-primary'"
                          th:text="${s.supplierType}"></span>
                </div>
                <p class="mb-1 small">📧 <span th:text="${s.contactEmail}"></span></p>
                <p class="mb-1 small">📞 <span th:text="${s.phone}"></span></p>
                <p class="mb-1 small">📍 <span th:text="${s.address}"></span></p>
                <p class="mb-2 small text-success">Discount: <span th:text="${s.discountRate * 100}"></span>%</p>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-warning" onclick="editSupplier([[${s.id}]],'[[${s.contactEmail}]]','[[${s.phone}]]')">Edit Contact</button>
                    <form th:action="@{/inventory/suppliers/delete/{id}(id=${s.id})}" method="post" onsubmit="return confirm('Delete?')">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-12 text-center py-4" th:if="${#lists.isEmpty(suppliers)}">
            <p class="text-muted">No suppliers found.</p>
            <a th:href="@{/inventory/suppliers/add}" class="btn btn-primary">Add First Supplier</a>
        </div>
    </div>
</div>
<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Update Contact Info</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <form id="editForm" method="post">
            <div class="modal-body">
                <div class="mb-3"><label class="form-label">Email</label>
                    <input type="email" id="editEmail" name="email" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Phone</label>
                    <input type="text" id="editPhone" name="phone" class="form-control"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary">Update</button>
            </div>
        </form>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function editSupplier(id, email, phone) {
        document.getElementById('editForm').action = '/inventory/suppliers/update/' + id;
        document.getElementById('editEmail').value = email;
        document.getElementById('editPhone').value = phone;
        new bootstrap.Modal(document.getElementById('editModal')).show();
    }
</script>
</body>
</html>
