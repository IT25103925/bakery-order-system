<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><title>Inventory Dashboard - SweetBite Bakery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{common/navbar :: navbar}"></div>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold">📦 Inventory Dashboard</h3>
    <a th:href="@{/inventory/ingredients/add}" class="btn btn-primary">+ Add Ingredient</a>
  </div>
  <div th:if="${!#lists.isEmpty(lowStock)}" class="alert alert-warning mb-3">
    ⚠️ <strong th:text="${#lists.size(lowStock)}"></strong> ingredients are running low!
  </div>
  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-dark"><tr>
          <th>ID</th><th>Ingredient</th><th>In Stock</th><th>Unit</th><th>Reorder Level</th><th>Supplier</th><th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody>
        <tr th:each="i : ${ingredients}" th:classappend="${i.lowStock} ? 'low-stock' : ''">
          <td th:text="${i.id}"></td>
          <td th:text="${i.name}"></td>
          <td class="fw-semibold" th:text="${i.quantityInStock}"></td>
          <td th:text="${i.unit}"></td>
          <td th:text="${i.reorderLevel}"></td>
          <td th:text="${i.supplierName}"></td>
          <td>
            <span class="badge bg-danger" th:if="${i.lowStock}">⚠ Low Stock</span>
            <span class="badge bg-success" th:unless="${i.lowStock}">OK</span>
          </td>
          <td>
            <button class="btn btn-sm btn-warning"
                    onclick="updateStock([[${i.id}]],[[${i.quantityInStock}]])">Update</button>
            <form th:action="@{/inventory/ingredients/delete/{id}(id=${i.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('Delete?')">
              <button class="btn btn-sm btn-outline-danger">Del</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<!-- Update Stock Modal -->
<div class="modal fade" id="stockModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Update Stock Level</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <form id="stockForm" method="post">
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">New Quantity</label>
          <input type="number" id="newQty" name="quantity" class="form-control" step="0.1" min="0"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Update</button>
      </div>
    </form>
  </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function updateStock(id, current) {
    document.getElementById('stockForm').action = '/inventory/ingredients/update/' + id;
    document.getElementById('newQty').value = current;
    new bootstrap.Modal(document.getElementById('stockModal')).show();
  }
</script>
</body>
</html>
